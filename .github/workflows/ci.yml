name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (shared -> backend -> frontend)
        run: npm run build

      - name: Typecheck (all workspaces, incl. desktop against backend's built types)
        run: npm run typecheck

      - name: Test (backend)
        run: npm test
