# eXcontrol kiosk — neutralise browser shortcuts from physical keyboards (installed as
# /etc/keyd/default.conf by pi/install.sh).
#
# Why: Chromium's --kiosk applies only to its first window. Tested with a kernel-level
# (uinput) keyboard: Ctrl+N opened a normal browser window with an address bar on top of the
# kiosk — from there http://localhost:8080 (the full installer dashboard) is one URL away.
# Page JavaScript cannot block these browser shortcuts, so they are dropped below the browser,
# at evdev level. Typing, Ctrl+A/C/V/X/Z, arrows, Tab and Enter keep working; the on-screen
# keyboard doesn't go through keyd at all.

[ids]
*

[main]
# help (opens a web page), find, caret browsing, focus toolbar, menu, fullscreen, DevTools
f1 = noop
f3 = noop
f6 = noop
f7 = noop
f10 = noop
f11 = noop
f12 = noop

[control]
# windows / tabs
n = noop
t = noop
w = noop
q = noop
tab = noop
pageup = noop
pagedown = noop
1 = noop
2 = noop
3 = noop
4 = noop
5 = noop
6 = noop
7 = noop
8 = noop
9 = noop
# address bar, search, open/save/print, history, downloads, source, bookmarks, find
l = noop
k = noop
e = noop
o = noop
s = noop
p = noop
h = noop
j = noop
u = noop
d = noop
f = noop
g = noop
# page zoom
minus = noop
equal = noop
0 = noop
kpplus = noop
kpminus = noop

[control+shift]
n = noop
t = noop
w = noop
q = noop
i = noop
j = noop
c = noop
k = noop
o = noop
b = noop
m = noop
a = noop
delete = noop
equal = noop

[alt]
# close, history back/forward, home page, app menus
f4 = noop
left = noop
right = noop
home = noop
f = noop
e = noop
d = noop

[control+alt]
# virtual-terminal switching (a login prompt on tty2..) — technicians use SSH
f1 = noop
f2 = noop
f3 = noop
f4 = noop
f5 = noop
f6 = noop
f7 = noop
f8 = noop
f9 = noop
f10 = noop
f11 = noop
f12 = noop
